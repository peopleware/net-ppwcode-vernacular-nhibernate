name: Publish to NuGet

on:
  push:
    tags:
      - 'III/[0-9]+.[0-9]+.[0-9]+'
      - 'III/[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build-and-test:
    name: Build & Test - ${{ matrix.name-suffix }}
    runs-on: ${{ matrix.os }}
    permissions:
      checks: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            name-suffix: 'Linux'
            test-filter: 'Category=SqlServer|Category!=SqlServer'
          - os: macos-latest
            name-suffix: 'macOS'
            test-filter: 'Category!=SqlServer'
          - os: windows-latest
            name-suffix: 'Windows'
            test-filter: 'Category=SqlServer|Category!=SqlServer'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Start SQL Server container
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Generate a random password for this test run
          SA_PASSWORD="P@ssw0rd_$(openssl rand -base64 12 | tr -d '/+=' | head -c 16)"
          echo "SA_PASSWORD=$SA_PASSWORD" >> $GITHUB_ENV

          docker run -d \
            --name sql-server \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD=$SA_PASSWORD \
            -e MSSQL_COLLATION=SQL_Latin1_General_CP1_CI_AI \
            -e MSSQL_MEMORY_LIMIT_MB=4096 \
            -p 1433:1433 \
            --health-cmd "sqlcmd -S localhost -U sa -P $SA_PASSWORD -Q 'SELECT 1' -b" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            mcr.microsoft.com/mssql/server:2017-latest

          # Wait for SQL Server to be healthy
          until docker inspect --format='{{.State.Health.Status}}' sql-server | grep -q healthy; do
            echo "Waiting for SQL Server to be ready..."
            sleep 2
          done
          echo "SQL Server is ready!"

      - name: Start SQL Server LocalDB
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Start LocalDB instance
          SqlLocalDB create MSSQLLocalDB
          SqlLocalDB start MSSQLLocalDB
          SqlLocalDB info MSSQLLocalDB

      - name: Restore dependencies
        shell: bash
        # do not add ContinuousIntegrationBuild here
        # since it will complain about the package lock file
        # ContinuousIntegrationBuild=true excludes full-framework
        # builds on Linux and macOS
        run: |
          dotnet restore PPWCode.Vernacular.NHibernate.sln \
            -p:Configuration=Release

      - name: Build
        shell: bash
        run: |
          dotnet build PPWCode.Vernacular.NHibernate.sln \
            --configuration Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true

      - name: Test
        shell: bash
        env:
          PPWCODE_APPSETTINGS__FIXEDCONNECTIONSTRING: ${{ matrix.os == 'ubuntu-latest' && format('Server=localhost,1433;Database=master;User Id=sa;Password={0};TrustServerCertificate=True', env.SA_PASSWORD) || (matrix.os == 'windows-latest' && 'Data Source=(localdb)\MSSQLLocalDB;Database=master;Integrated Security=True;' || '') }}
        run: |
          dotnet test PPWCode.Vernacular.NHibernate.sln \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFilePrefix=test-results" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --filter "${{ matrix.test-filter }}" \
            -p:ContinuousIntegrationBuild=true

      - name: Stop SQL Server container
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          docker stop sql-server || true
          docker rm sql-server || true

      - name: Publish Test Results
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }} # run this step even if previous step failed
        with:
          name: Test Results - ${{ matrix.name-suffix }}
          report-title: Test Results - ${{ matrix.name-suffix }}
          path: 'coverage/test-results_*_*.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Generate Coverage Report
        if: always()
        shell: bash
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coveragereport-html" \
            -reporttypes:"Html;MarkdownSummaryGithub" \
            -verbosity:Warning

      - name: Add Coverage to Job Summary
        if: always()
        shell: bash
        run: |
          if [ -f coveragereport-html/SummaryGithub.md ]; then
            echo "## Code Coverage - ${{ matrix.name-suffix }}" >> $GITHUB_STEP_SUMMARY
            cat coveragereport-html/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-html-${{ matrix.name-suffix }}
          path: coveragereport-html/
          retention-days: 30

      - name: Upload Test and Coverage Raw Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-raw-${{ matrix.name-suffix }}
          path: coverage/
          retention-days: 30

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          # Extract full tag (e.g., I/1.2.3 or II/2.0.0-beta1)
          FULL_TAG=${GITHUB_REF#refs/tags/}
          
          # Validate tag format with roman numeral prefix
          if [[ ! $FULL_TAG =~ ^[IVX]+/[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "ERROR: Tag '$FULL_TAG' does not match format {ROMAN}/{VERSION}"
            echo "Expected format: I/1.2.3 or II/2.0.0-beta1"
            exit 1
          fi
          
          # Extract version part (strip roman numeral prefix)
          VERSION=${FULL_TAG#*/}
          
          # Extract commit hash (short)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          # Extract major version for AssemblyVersion (e.g., 1.2.3 -> 1.0.0.0)
          if [[ $VERSION =~ ^([0-9]+) ]]; then
            ASSEMBLY_VERSION="${BASH_REMATCH[1]}.0.0.0"
          fi
          
          # InformationalVersion = semantic version + commit hash
          INFORMATIONAL_VERSION="${VERSION}+${COMMIT_HASH}"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "assembly_version=$ASSEMBLY_VERSION" >> $GITHUB_OUTPUT
          echo "informational_version=$INFORMATIONAL_VERSION" >> $GITHUB_OUTPUT
          echo "Using tag: $FULL_TAG"
          echo "Version: $VERSION"
          echo "AssemblyVersion: $ASSEMBLY_VERSION"
          echo "InformationalVersion: $INFORMATIONAL_VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        shell: bash
        # do not add ContinuousIntegrationBuild here
        # since it will complain about the package lock file
        # ContinuousIntegrationBuild=true excludes full-framework
        # builds on Linux and macOS
        run: |
          dotnet restore PPWCode.Vernacular.NHibernate.sln \
            -p:Configuration=Release

      - name: Build
        shell: bash
        run: |
          dotnet build PPWCode.Vernacular.NHibernate.sln \
            --configuration Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -p:Version=${{ steps.get_version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.get_version.outputs.assembly_version }} \
            -p:InformationalVersion=${{ steps.get_version.outputs.informational_version }}

      - name: Pack
        shell: bash
        run: |
          dotnet pack PPWCode.Vernacular.NHibernate.sln \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:PackageVersion=${{ steps.get_version.outputs.version }}

      - name: NuGet login (OIDC for temp api key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.PPWCODE_NUGET_USER }}

      - name: Publish to NuGet
        shell: bash
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
